name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build and package
        run: bash scripts/build-app.sh debug
